[project]
name = "auth-service"
version = "0.1.0"
description = "Service d'authentification (JWT RS256, credentials Postgres dynamiques via Vault)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "passlib[argon2]>=1.7",
    "pyjwt[crypto]>=2.9",
    "hvac>=2.3",
    "pydantic-settings>=2.5",
    "email-validator>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.uv]
package = false
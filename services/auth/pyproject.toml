[project]
name = "auth-service"
version = "0.1.0"
description = "Service d'authentification (pseudo + mot de passe, JWT RS256, Vault dynamique)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "passlib[argon2]>=1.7.4",
    "pyjwt[crypto]>=2.9",
    "hvac>=2.3",
]

# Application, pas une librairie : uv installe les dépendances sans builder "src".
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
